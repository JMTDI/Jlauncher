name: Build and release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.6)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build APK
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KS_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BT=$(ls -d "$SDK"/build-tools/* | sort -V | tail -1)
          JAR=$(ls "$SDK"/platforms/android-34/android.jar 2>/dev/null || ls "$SDK"/platforms/*/android.jar | sort -V | tail -1)
          O=build
          mkdir -p $O/classes $O/gen

          "$BT/aapt" package -f -m -J $O/gen -M app/AndroidManifest.xml -S app/res \
            -I "$JAR" --min-sdk-version 26 --target-sdk-version 34 -F $O/res.apk
          javac --release 8 -Xlint:-options -cp "$JAR" -d $O/classes \
            $(find app/src $O/gen -name '*.java')
          "$BT/d8" --min-api 26 --lib "$JAR" --output $O $(find $O/classes -name '*.class')
          cp $O/res.apk $O/unaligned.apk
          (cd $O && "$BT/aapt" add -k unaligned.apk classes.dex >/dev/null)
          "$BT/zipalign" -f -p 4 $O/unaligned.apk $O/aligned.apk

          if [ -n "${KEYSTORE_B64:-}" ]; then
            echo "$KEYSTORE_B64" | base64 -d > $O/release.jks
            KS=$O/release.jks
          else
            # No signing secrets: fall back to a throwaway key (APKs from different runs can't update each other).
            KS=$O/ci.jks; KS_PASS=android; KEY_ALIAS=ci; KEY_PASS=android
            keytool -genkeypair -keystore $KS -storepass $KS_PASS -keypass $KEY_PASS \
              -alias $KEY_ALIAS -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=JLauncher CI"
          fi
          "$BT/apksigner" sign --ks "$KS" --ks-pass "pass:$KS_PASS" \
            --ks-key-alias "$KEY_ALIAS" --key-pass "pass:$KEY_PASS" \
            --out $O/JLauncher.apk $O/aligned.apk
          "$BT/apksigner" verify $O/JLauncher.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: JLauncher
          path: build/JLauncher.apk

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          cp build/JLauncher.apk "build/JLauncher-$TAG.apk"
          gh release create "$TAG" "build/JLauncher-$TAG.apk" \
            --title "JLauncher $TAG" --generate-notes --target "${{ github.sha }}"
